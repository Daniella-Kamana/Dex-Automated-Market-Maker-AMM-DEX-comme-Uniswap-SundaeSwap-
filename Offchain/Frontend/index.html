<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cardano DEX Terminal — Swap</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  
<nav>
  <div class="title">Cardano DEX</div>
  <a href="index.html" class="active">Swap</a>
  <a href="liquidity.html">Liquidity</a>
  <a href="pools.html">Pools</a>
  <a href="history.html">History</a>
  
 
  <div class="nav-right">
    <button id="themeToggle" class="btn">Toggle Theme</button>
    <button id="connectBtn" class="btn primary">Connect Wallet</button>
  </div>
</nav>

<div class="layout">
  <aside class="side">
    <div class="card small">
      <h3>Order Book (Live)</h3>
      <div id="orderbook" class="orderbook"></div>
    </div>
    <div class="card small">
      <h3>Market Depth</h3>
      <canvas id="depthChart" width="300" height="180"></canvas>
    </div>
  </aside>

  <main class="content">
    <div class="stats-row">
      <div class="stat">TVL <div class="big" id="tvl">$5.2M</div></div>
      <div class="stat">Volume <div class="big" id="volume">$12.8M</div></div>
      <div class="stat">LPs <div class="big" id="lps">1,240</div></div>
    </div>

    <div class="stats-row">
    <div class="card split">
      <div class="left">
        <h2>Swap</h2>
        <div class="form-row">
          <label>From</label>
          <select id="swapFrom"></select>
          <input id="amountFrom" placeholder="Amount">
        </div>
        <div class="form-row">
          <label>To</label><select id="swapTo">
          </select><input id="amountTo" readonly placeholder="Estimated">
        </div>
        <div class="form-row small">  
          <label>Slippage</label>
          <input id="slippage" type="number" value="0.5">%
        </div>
        <div class="form-row">
          <button id="estimateBtn" class="btn primary">Estimate</button>
          <button id="swapBtn" class="btn primary">Swap</button>
          
        </div>
        <div id="impact" class="muted">Price impact: 
          <span id="impactVal">0%</span>
        </div>
      </div>
      <div class="right">
        <h3>Price Chart</h3>
        <canvas id="priceChart" width="700" height="260"></canvas>
        <div class="mini-stats">
          <div>Last: <span id="lastPrice">—</span></div>
          <div>24h %: <span id="change24">—</span></div>
        </div>
      </div>
    </div>
  </div>

    <div class="card">
      <h3>Pools</h3>
      <div id="poolList" class="pool-grid"></div>
    </div>

  </main>
</div>

<script src="app.js"></script>

</body>
</html>
